[package]
name = "lola-sumup"
version = "0.4.10"
authors = ["Urs Joss <urs.joss@gmx.ch>"]
edition = "2024"
description = "A cli program to create LoLa specific exports from monthly SumUp reports"
license = "MIT"
homepage = "https://github.com/jococo-ch/lola-sumup"
repository = "https://github.com/jococo-ch/lola-sumup"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
chrono= { version = "0.4.45", features = ["serde"] }
strum = { version = "0.28.0" }
strum_macros = { version = "0.28.0" }
polars_excel_writer = "0.26.0"
calamine = { version = "0.36.0", features = ["chrono"] }
rust_xlsxwriter = { version = "0.93.0", features = ["polars"] }

[dependencies.polars]
version = "0.52.0"
features = [
    "abs",
    "is_in",
    "lazy",
    "round_series",
    "strings",
    "timezones", # required by polars-0.52.0 bug: TZ_AWARE_RE not feature-gated
]

[dev-dependencies]
pretty_assertions = "1.4.1"
rstest = "0.26.1"

[profile.dev]
opt-level=1

[profile.release]
lto = true
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[package.metadata.dist]
dist = true

